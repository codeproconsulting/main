# Temporary first-install vhost: ACME only; never forwards credentials over HTTP.
# Install this OR crm.proconsulting.uk.conf, never both at once.
server {
    listen 80;
    server_name crm.proconsulting.uk;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
