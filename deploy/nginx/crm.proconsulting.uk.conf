# Install alongside the existing website vhost. Do not replace Appwrite's proxy.
# This file is included inside nginx's http context on Debian/Ubuntu.
limit_req_zone $binary_remote_addr zone=pc_crm_login:10m rate=5r/m;

server {
    listen 80;
    server_name crm.proconsulting.uk;
    # Enable HTTPS using Certbot before accepting staff logins.
    # Certbot adds the TLS listener and HTTP redirect.
    client_max_body_size 25M;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = / { return 302 /admin; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location ~ ^/admin/login(?:\.data)?$ {
        limit_req zone=pc_crm_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location /admin {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location = /Logo_main.png {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location / { return 404; }
}
