# Final vhost, included in nginx's http context. Certificate must exist first.
# See CRM-DEPLOYMENT.md for the certificate-only bootstrap and edge prerequisites.
limit_req_zone $binary_remote_addr zone=pc_crm_login:10m rate=5r/m;

server {
    listen 80;
    server_name crm.proconsulting.uk;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://crm.proconsulting.uk$request_uri; }
}

server {
    listen 443 ssl;
    server_name crm.proconsulting.uk;
    ssl_certificate /etc/letsencrypt/live/crm.proconsulting.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.proconsulting.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PC_CRM_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25M;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = / { return 302 /admin; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location ~ ^/admin/login(?:\.data)?$ {
        limit_req zone=pc_crm_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location = /admin {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    # React Router root data request and lazy route discovery.
    location = /admin.data {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location = /__manifest {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location = /Logo_main.png {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proconsulting-crm-proxy.conf;
    }
    location / { return 404; }
}
